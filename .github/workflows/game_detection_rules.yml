name: Game detection rules
on:
  pull_request:
    paths:
      - 'data/game_detection_rules/**'
      - 'src/game_detection/**'
      - 'scripts/check_game_detection.py'
      - '.github/workflows/game_detection_rules.yml'
      - 'Makefile'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.18,<5'
      - run: make check-game-detection
